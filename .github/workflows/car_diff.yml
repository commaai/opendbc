name: car diff

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  comment:
    name: comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
    - name: Wait for car diff
      id: wait
      continue-on-error: true
      uses: lewagon/wait-on-check-action@v1.9.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        check-name: car diff
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        allowed-conclusions: success
        wait-interval: 20
    - name: Download car diff
      if: steps.wait.outcome == 'success'
      uses: dawidd6/action-download-artifact@v24
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: tests.yml
        workflow_conclusion: ''
        commit: ${{ github.event.pull_request.head.sha }}
        name: car_diff_${{ github.event.number }}
        path: .
        allow_forks: true
    - name: Comment car diff on PR
      if: steps.wait.outcome == 'success'
      uses: thollander/actions-comment-pull-request@v3.0.1
      with:
        file-path: diff.txt
        comment-tag: car_diff
        pr-number: ${{ github.event.number }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
