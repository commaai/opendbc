cache = ["/data/tmp/comma_download_cache"]

[env]
PYTHONPATH = "/data/ci/tree:/data/ci/tree/opendbc"
PYTHONWARNINGS = "error"
LOGLEVEL = "debug"
COMMA_CACHE = "/data/tmp/comma_download_cache"
NUM_JOBS = "10"

[steps.build]
name = "Build"
run = """
rm -rf ../panda
git clone -q --depth 1 https://github.com/commaai/panda.git ../panda
cd ../panda
scons
scripts/reflash_internal_panda.py
"""

[steps.replay]
name = "Replay"
run = "python opendbc/safety/tests/safety_replay/hw_replay.py"

# a tenth of the routes each, on the up-can stations and any free comma four

[jobs.replay_0]
runs-on = "up-can"
env = { JOB_ID = "0" }
steps = [{ uses = "build" }, { uses = "replay" }]

